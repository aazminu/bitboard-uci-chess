[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitboard-uci-chess"
version = "0.2.0"
description = "64-bit bitboard chess engine with classical ray attack tables, Zobrist hashing, Transposition Table, PeSTO tapered evaluation, and UCI driver."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abdullah Azmi", email = "m4u5t4@u.northwestern.edu" }
]
keywords = ["chess", "bitboard", "uci", "zobrist", "negamax", "alpha-beta", "pesto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
bitboard-uci = "bitboard_chess.uci:main"

[project.urls]
Homepage = "https://abdullahazmi.com"
Repository = "https://github.com/aazminu/bitboard-uci-chess"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
